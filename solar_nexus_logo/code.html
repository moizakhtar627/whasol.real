<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38D9FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB547"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>

  </defs>

    <polygon points="22,2 42,14 42,34 22,46 2,34 2,14" stroke="url(#cyanGrad)" stroke-width="2.5" fill="none" opacity="0.4"/>

    <circle cx="22" cy="24" r="6" fill="url(#amberGrad)" filter="url(#glow)"/>
    <line x1="22" y1="12" x2="22" y2="15" stroke="#38D9FF" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="33" x2="22" y2="36" stroke="#38D9FF" stroke-width="2" stroke-linecap="round"/>
    <line x1="11" y1="24" x2="14" y2="24" stroke="#38D9FF" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="24" x2="33" y2="24" stroke="#38D9FF" stroke-width="2" stroke-linecap="round"/>
    <circle cx="22" cy="24" r="1.5" fill="#FFFFFF"/>
  </g>
  <!-- Typography -->
  <text x="64" y="33" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="20" font-weight="700" fill="#F8FAFC" letter-spacing="1">WHASOL</text>
</svg>
